name: SetupAzureTerraform
description: "Action used to setup and deploy to azure"
inputs:
  env:
    description: "Environment (DEV or PROD)"
    required: true
  working-directory:
    description: "Dir where Azure code is present"
runs:
  using: composite
  steps:
    - name: Checkout code
      uses:  actions/checkout@v4

    - name: Set Environment-Specific Azure Credentials
      shell: bash
      run: |
        echo "AZURE_CLIENT_ID=${{ secrets[format('{0}_AZURE_CLIENT_ID', inputs.env)] }}" >> $GITHUB_ENV
        echo "AZURE_TENANT_ID=${{ secrets[format('{0}_AZURE_TENANT_ID', inputs.env)] }}" >> $GITHUB_ENV
        echo "AZURE_SUBSCRIPTION_ID=${{ secrets[format('{0}_AZURE_SUBSCRIPTION_ID', inputs.env)] }}" >> $GITHUB_ENV

    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Run Terraform Plan
      shell: bash
      working-directory: "${{inputs.working-directory}}/Azure"
      run: |
        terraform init  # Initialize Terraform
        terraform plan  # Run Terraform plan
